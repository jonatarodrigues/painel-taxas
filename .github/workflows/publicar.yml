name: publicar

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 20h em Brasília, dias úteis
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Restaurar o cache das fontes
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Atualizar os dados
        run: python atualizar.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # o fredgraph.csv não responde a IPs de nuvem

      # Falhas de rede costumam durar minutos (ex.: DNS do api.bcb.gov.br em 02/10/2026),
      # mais que as tentativas de segundos do pipeline. Se alguma fonte caiu no cache,
      # espera e roda de novo uma única vez; o que já baixou continua no cache.
      - name: Repetir se alguma fonte falhou
        run: |
          if python -c "import json, re, sys; avisos = json.load(open('dados.json', encoding='utf-8'))['avisos']; sys.exit(0 if any(re.search(r'falha ao baixar|indisponível|sem cotação', a) for a in avisos) else 1)"; then
            echo "Alguma fonte falhou; nova tentativa em 10 minutos."
            sleep 600
            python atualizar.py
          else
            echo "Todas as fontes responderam."
          fi
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Guardar o cache das fontes
        if: always() && hashFiles('cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: cache
          key: dados-${{ github.run_id }}

      - name: Montar o site
        run: |
          mkdir -p _site
          cp painel.html painel.css painel.js dados.js dados.json _site/
          cp site/index.html _site/index.html
          cp site/og.png _site/og.png

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
