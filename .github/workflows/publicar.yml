name: publicar

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 20h em Brasília, dias úteis
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Restaurar o cache das fontes
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Atualizar os dados
        run: python atualizar.py

      - name: Guardar o cache das fontes
        if: always() && hashFiles('cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: cache
          key: dados-${{ github.run_id }}

      - name: Montar o site
        run: |
          mkdir -p _site
          cp painel.html painel.css painel.js dados.js dados.json _site/
          cp site/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
